name: int8-probe

on:
  workflow_dispatch:
  push:
    branches: [pr1098-runner-probe]

jobs:
  probe:
    strategy:
      fail-fast: false
      matrix:
        runner: [macos-15, macos-26]
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Install MLX
        run: python -m pip install -q "mlx>=0.29" numpy
      - name: Machine facts
        run: |
          echo "runner-label: ${{ matrix.runner }}"
          sw_vers
          sysctl -n machdep.cpu.brand_string || true
          system_profiler SPHardwareDataType 2>/dev/null | grep -Ei "chip|model name|total number of cores" || true
          xcrun metal --version 2>&1 | head -3 || true
          python -c "import mlx.core as mx; print('mlx', mx.__version__); print('device_info', mx.device_info())"
      - name: MPP header present?
        run: |
          SDK=$(xcrun --show-sdk-path)
          echo "sdk: $SDK"
          ls "$SDK/System/Library/Frameworks/MetalPerformancePrimitives.framework/Headers/" 2>&1 | head || echo "NO MPP FRAMEWORK IN SDK"
      - name: Raw MPP int8 GEMM (compile + run + exactness)
        run: PYTHONPATH=. python ci_probe/raw_gemm.py
        continue-on-error: true
      - name: capability.is_supported()
        run: PYTHONPATH=. python ci_probe/gate.py
        continue-on-error: true
      - name: Bit-exact GEMM sweep vs numpy int32
        run: PYTHONPATH=. python ci_probe/exact_sweep.py
        continue-on-error: true
      - name: Metal backend end-to-end vs mx.quantized_matmul
        run: PYTHONPATH=. python ci_probe/e2e.py
        continue-on-error: true
      - name: Benchmark int8 vs mlx qmm
        run: PYTHONPATH=. python ci_probe/bench.py
        continue-on-error: true
      - name: Model forward changed by enable()?
        run: PYTHONPATH=. python ci_probe/forward.py
        continue-on-error: true
