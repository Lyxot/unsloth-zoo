name: MLX Real VLM and Audio Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-vlm-audio:
    name: Real MLX VLM/audio chat (${{ matrix.shard }})
    runs-on: macos-14
    timeout-minutes: 180
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: small-a
            max_model_gb: "8.0"
            case_timeout_s: "600"
            total_budget_s: "3600"
            disk_multiplier: "2.0"
            min_passes: "1"
            large_models: "false"
          - shard: small-b
            max_model_gb: "8.0"
            case_timeout_s: "600"
            total_budget_s: "3600"
            disk_multiplier: "2.0"
            min_passes: "0"
            large_models: "false"
          - shard: medium-a
            max_model_gb: "12.0"
            case_timeout_s: "900"
            total_budget_s: "5400"
            disk_multiplier: "1.7"
            min_passes: "1"
            large_models: "false"
          - shard: medium-b
            max_model_gb: "12.0"
            case_timeout_s: "900"
            total_budget_s: "5400"
            disk_multiplier: "1.7"
            min_passes: "0"
            large_models: "false"
          - shard: large-a
            max_model_gb: "18.0"
            case_timeout_s: "1200"
            total_budget_s: "7200"
            disk_multiplier: "1.35"
            min_passes: "0"
            large_models: "true"
          - shard: large-b
            max_model_gb: "26.0"
            case_timeout_s: "1200"
            total_budget_s: "7200"
            disk_multiplier: "1.25"
            min_passes: "0"
            large_models: "true"
          - shard: moe
            max_model_gb: "40.0"
            case_timeout_s: "2400"
            total_budget_s: "9600"
            disk_multiplier: "1.15"
            min_passes: "0"
            large_models: "true"
          - shard: audio-a
            max_model_gb: "16.0"
            case_timeout_s: "1200"
            total_budget_s: "7200"
            disk_multiplier: "1.4"
            min_passes: "0"
            large_models: "true"
          - shard: audio-b
            max_model_gb: "40.0"
            case_timeout_s: "1800"
            total_budget_s: "9000"
            disk_multiplier: "1.2"
            min_passes: "0"
            large_models: "true"
    env:
      HF_HUB_DISABLE_XET: "1"
      HF_HOME: /tmp/unsloth-hf-${{ matrix.shard }}
      PIP_NO_CACHE_DIR: "1"
      TOKENIZERS_PARALLELISM: "false"
      UNSLOTH_MLX_REAL_SHARD: ${{ matrix.shard }}
      UNSLOTH_MLX_REAL_MAX_MODEL_GB: ${{ matrix.max_model_gb }}
      UNSLOTH_MLX_REAL_MIN_REAL_PASSES: ${{ matrix.min_passes }}
      UNSLOTH_MLX_REAL_CASE_TIMEOUT_S: ${{ matrix.case_timeout_s }}
      UNSLOTH_MLX_REAL_TOTAL_BUDGET_S: ${{ matrix.total_budget_s }}
      UNSLOTH_MLX_REAL_DISK_MULTIPLIER: ${{ matrix.disk_multiplier }}
      UNSLOTH_MLX_REAL_MAX_TOKENS: "2"

    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: Show runner resources
        run: |
          uname -a
          python - <<'PY'
          import os, platform, shutil
          print("shard:", os.environ["UNSLOTH_MLX_REAL_SHARD"])
          print("machine:", platform.machine())
          print("python:", platform.python_version())
          print("free_gib:", round(shutil.disk_usage(".").free / 1024**3, 2))
          PY
          sysctl vm.swapusage || true
          ulimit -n || true

      - name: Prepare macOS swap headroom for large models
        if: matrix.large_models == 'true'
        run: |
          # macOS grows swap dynamically under /private/var/vm; keep disk headroom
          # available there for large MLX models instead of adding Linux swapon.
          sudo mkdir -p /private/var/vm
          sudo purge || true
          ulimit -n 65536 || true
          rm -rf ~/Library/Caches/pip ~/.cache/pip "$HF_HOME" || true
          brew cleanup -s || true
          sysctl vm.swapusage || true
          df -h

      - name: Install zoo with MLX and media deps
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0" "torchvision>=0.19.0" "torchaudio>=2.4.0"
          pip install -e .[mlx]
          pip install "pytest==9.0.3" "soundfile>=0.12.1" "timm>=1.0.0" "addict>=2.4.0" "matplotlib>=3.8.0"

      - name: Real VLM/audio generation matrix
        run: |
          ulimit -n 65536 || true
          python .github/scripts/mlx_real_vlm_audio_smoke.py

      - name: Final disk report
        if: always()
        run: |
          sysctl vm.swapusage || true
          df -h
          du -sh "$HF_HOME" 2>/dev/null || true
