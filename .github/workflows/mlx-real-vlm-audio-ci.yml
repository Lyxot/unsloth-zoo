name: MLX Real VLM and Audio Smoke

on:
  pull_request:
    types: [opened, synchronize, reopened]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  real-vlm-audio:
    name: Real MLX VLM/audio generation smoke
    if: >-
      github.event_name == 'workflow_dispatch' ||
      github.head_ref == 'fix/gemma4-vlm-processor'
    runs-on: macos-14
    timeout-minutes: 180
    env:
      HF_HUB_DISABLE_XET: "1"
      TOKENIZERS_PARALLELISM: "false"
      UNSLOTH_MLX_REAL_MAX_MODEL_GB: "8.0"
      UNSLOTH_MLX_REAL_MIN_REAL_PASSES: "6"
      UNSLOTH_MLX_REAL_CASE_TIMEOUT_S: "900"
      UNSLOTH_MLX_REAL_TOTAL_BUDGET_S: "9600"
      UNSLOTH_MLX_REAL_MAX_TOKENS: "2"

    steps:
      - name: Harden runner (audit)
        uses: step-security/harden-runner@a5ad31d6a139d249332a2605b85202e8c0b78450
        with:
          egress-policy: audit

      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"
          cache: "pip"

      - name: Show runner resources
        run: |
          uname -a
          python - <<'PY'
          import platform, shutil
          print("machine:", platform.machine())
          print("python:", platform.python_version())
          print("free_gib:", round(shutil.disk_usage(".").free / 1024**3, 2))
          PY

      - name: Install zoo with MLX and media deps
        run: |
          python -m pip install --upgrade pip
          pip install "torch>=2.4.0,<2.13.0" "torchvision>=0.19.0" "torchaudio>=2.4.0"
          pip install -e .[mlx]
          pip install "pytest==9.0.3" "soundfile>=0.12.1"

      - name: Real VLM/audio generation matrix
        run: python .github/scripts/mlx_real_vlm_audio_smoke.py

      - name: Final disk report
        if: always()
        run: |
          df -h
          du -sh ~/.cache/huggingface 2>/dev/null || true
