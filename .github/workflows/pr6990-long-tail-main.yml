# Disposable repro workflow. Delete after validation.

name: "PR 6990 Long-tail Main Benchmark"

on:
  push:
    branches:
      - "pr-6990-long-tail-repro-ci-*"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  repro:
    name: "Long-tail main"
    runs-on: "macos-14"
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd
        with:
          persist-credentials: false

      - uses: actions/setup-python@a309ff8b426b58ec0e2a45f0f869d46889d02405
        with:
          python-version: "3.12"

      - name: "Record Apple Silicon runner"
        shell: bash
        run: |
          uname -a
          sw_vers
          sysctl -n machdep.cpu.brand_string
          sysctl -n hw.memsize

      - name: "Prepare upstream main source"
        shell: bash
        run: |
          git fetch --no-tags https://github.com/unslothai/unsloth-zoo.git main
          git worktree add --detach "$RUNNER_TEMP/unsloth-zoo-main" FETCH_HEAD
          echo "BENCH_SOURCE=$RUNNER_TEMP/unsloth-zoo-main" >> "$GITHUB_ENV"
          git -C "$RUNNER_TEMP/unsloth-zoo-main" log -1 --oneline

      - name: "Install pinned MLX benchmark stack"
        shell: bash
        run: |
          python -m pip install --upgrade pip
          python -m pip install "torch==2.10.0" "torchvision==0.25.0" "mlx==0.32.0" "mlx-lm==0.31.2" "mlx-vlm==0.4.4"
          python -m pip install -e "$BENCH_SOURCE[mlx]"
          python -c "import mlx.core as mx; print(mx.device_info())"

      - name: "Benchmark upstream main long tail"
        shell: bash
        run: |
          mkdir -p artifacts
          HF_HUB_DISABLE_XET=1 nice -n 10 python "$GITHUB_WORKSPACE/.github/benchmarks/pr6990_long_tail.py" --source "$BENCH_SOURCE" --mode main --output artifacts/main.json

      - name: "Upload main benchmark artifact"
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a  # v7.0.1
        with:
          name: pr6990-long-tail-main
          path: artifacts/main.json
          if-no-files-found: warn
